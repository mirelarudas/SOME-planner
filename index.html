<!doctype html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FieldView SoMe Planner</title>
  <style>
    :root{
      --bg:#0d1117;--panel:#151b23;--panel2:#171d25;--line:#293548;
      --text:#d7e0e8;--muted:#8c98a6;--green:#49c95f;--blue:#5ca9ff;
      --purple:#bb8cff;--orange:#fb9c47;--red:#ff5b56
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font:14px Arial,sans-serif}
    button,input,textarea,select{font:inherit}
    .hidden{display:none!important}
    .welcome{min-height:100vh;display:grid;place-items:center;padding:20px}
    .card{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:30px}
    h1{margin:0;color:#edf3f8;font-size:29px} h1 span{color:var(--green)}
    p{line-height:1.5;color:var(--muted)}
    input,textarea,select{width:100%;padding:11px;margin:6px 0;border:1px solid #354257;border-radius:7px;background:#0d1117;color:#e2e9ef}
    textarea{min-height:100px;resize:vertical}
    .primary,.save,.new{border:0;border-radius:7px;background:var(--green);color:#092212;font-weight:800;cursor:pointer}
    .primary,.save{width:100%;padding:12px;margin-top:8px}
    .message{min-height:20px;color:#ff9c96;margin-top:10px}
    .app{display:flex;min-height:100vh}
    aside{width:220px;background:#151a21;border-right:1px solid #222d38;padding:23px 12px}
    .logo{padding:0 12px 35px;font-size:22px;font-weight:800;color:#eef4f9}.logo span{color:var(--green)}.logo small{font-size:12px;color:#96a1ad}
    .label{margin:12px;color:var(--muted);font-size:10px;letter-spacing:1.4px}
    .nav button{width:100%;background:transparent;border:0;border-radius:6px;color:#aeb9c4;text-align:left;padding:12px;cursor:pointer}
    .nav button.active{color:#58d76d;background:#1c6630}
    main{flex:1;min-width:0;padding:0 28px 30px}
    header{height:87px;margin:0 -28px 31px;padding:0 28px;display:flex;align-items:center;gap:8px;border-top:2px solid #826515;border-bottom:1px solid #273142}
    .dot{width:8px;height:8px;border:2px solid var(--green);border-radius:50%}.grow{flex:1}
    .user,.button,.heading button{padding:9px 13px;border:1px solid #2d3a50;border-radius:7px;background:#182130;color:#c9d2dc;cursor:pointer}
    .user{border-radius:20px}
    .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:35px}
    .stat{min-height:100px;padding:20px;background:var(--panel);border:1px solid var(--line);border-radius:9px}
    .stat b{display:block;font-size:28px}.stat small{display:block;margin-top:9px;color:#9aa5b1;font-size:10px;letter-spacing:1px}
    .green{color:var(--green)}.blue{color:var(--blue)}.purple{color:var(--purple)}.orange{color:var(--orange)}.red{color:var(--red)}
    .heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.heading h2{margin:0;font-size:24px;color:#e3eaf1}
    .week,.calendar{display:grid;grid-template-columns:repeat(7,minmax(90px,1fr));gap:4px}
    .week div{text-align:center;color:var(--muted);font-size:11px;padding:10px}
    .day{height:106px;overflow:hidden;padding:9px;border:1px solid var(--line);border-radius:6px;background:var(--panel2)}
    .day.empty{background:transparent;border-color:transparent}.date{font-size:12px;color:#aab5c1}
    .event{display:block;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:7px;padding:4px 5px;border:0;border-left:3px solid var(--purple);border-radius:3px;background:#202937;color:#dce4ec;text-align:left;font-size:10px;cursor:pointer}
    .new{margin-top:27px;padding:10px 15px}.loading{margin-top:15px;color:var(--muted)}
    .overlay{position:fixed;inset:0;z-index:5;display:none;place-items:center;padding:15px;background:#000a}.overlay.show{display:grid}
    .modal{width:min(540px,100%);background:var(--panel);border:1px solid #354257;border-radius:10px;padding:22px}.modal h2{margin:0 0 12px}
    .close{float:right;border:0;background:none;color:#fff;font-size:23px;cursor:pointer}.row{display:flex;gap:8px}
    @media(max-width:850px){
      aside{width:62px;padding:20px 6px}.logo{font-size:0;padding:5px 0 30px;text-align:center}.logo span{font-size:19px}
      .label,.nav button:not(.active){display:none}.nav button.active{font-size:0;text-align:center}.nav button.active:first-letter{font-size:18px}
      main{padding:0 13px}header{margin:0 -13px 20px;padding:0 13px}.user{display:none}.stats{grid-template-columns:repeat(2,1fr)}
      .week,.calendar{overflow:auto}.week div,.day{min-width:90px}
    }
  </style>
</head>
<body>

  <section id="nameScreen" class="welcome">
    <div class="card">
      <h1>FieldView <span>SoMe</span></h1>
      <p>Calendar editorial comun pentru echipă.</p>
      <p>Scrie numele tău ca să știm cine adaugă fiecare postare.</p>
      <input id="personName" maxlength="60" placeholder="Numele tău">
      <button class="primary" onclick="enterPlanner()">Intră în planner</button>
      <div id="message" class="message"></div>
    </div>
  </section>

  <div id="appScreen" class="app hidden">
    <aside>
      <div class="logo">FieldView <span>SoMe</span> <small>2026</small></div>
      <div class="label">VIZUALIZARE</div>
      <div class="nav">
        <button class="active">📅 Calendar</button>
        <button>▣ Listă posturi</button>
        <button>◷ Activitate echipă</button>
      </div>
    </aside>

    <main>
      <header>
        <span class="dot"></span><b>Echipă</b><span class="grow"></span>
        <span class="user" id="userName">👤</span>
        <button class="button" onclick="loadPosts()">↻ Sync</button>
        <button class="button" onclick="changeName()">Schimbă nume</button>
      </header>

      <section class="stats">
        <div class="stat"><b id="published" class="green">0</b><small>POSTATE</small></div>
        <div class="stat"><b id="drafts" class="blue">0</b><small>DRAFT-URI</small></div>
        <div class="stat"><b id="planned" class="purple">0</b><small>PLANIFICATE</small></div>
        <div class="stat"><b id="thisMonth" class="orange">0</b><small>LUNA ACEASTA</small></div>
        <div class="stat"><b id="total" class="red">0</b><small>TOTAL ANUAL</small></div>
      </section>

      <div class="heading">
        <h2 id="calendarTitle"></h2>
        <div>
          <button onclick="moveMonth(-1)">← Prev</button>
          <button onclick="moveMonth(1)">Next →</button>
        </div>
      </div>

      <div class="week"><div>Dum</div><div>Lun</div><div>Mar</div><div>Mie</div><div>Joi</div><div>Vin</div><div>Sâm</div></div>
      <div id="calendar" class="calendar"></div>
      <div id="loading" class="loading"></div>
      <button class="new" onclick="openModal()">＋ Post nou</button>
    </main>
  </div>

  <div id="overlay" class="overlay">
    <form class="modal" onsubmit="savePost(event)">
      <button type="button" class="close" onclick="closeModal()">×</button>
      <h2>Post nou</h2>
      <input id="postTitle" required placeholder="Titlul postării">
      <textarea id="postText" placeholder="Textul postării"></textarea>
      <div class="row">
        <input id="postDate" type="date" required>
        <select id="postPlatform"><option>Facebook</option><option>Instagram</option><option>LinkedIn</option><option>TikTok</option></select>
      </div>
      <div class="row">
        <select id="postStatus"><option value="draft">Draft</option><option value="planned">Planificat</option><option value="published">Publicat</option></select>
        <input id="postOwner" readonly>
      </div>
      <button class="save">Salvează postarea</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "const SUPABASE_URL = "https://svxqbnnusefdgsptqgva.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_l_ggT4dbeGAqhtjHN-mdGA_A6XLits-";

    const supabase = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const months = ["Ianuarie","Februarie","Martie","Aprilie","Mai","Iunie","Iulie","August","Septembrie","Octombrie","Noiembrie","Decembrie"];
    let currentDate = new Date();
    let posts = [];
    let userName = localStorage.getItem("somePlannerUserName") || "";

    function enterPlanner() {
      const name = document.getElementById("personName").value.trim();
      if (name.length < 2) {
        document.getElementById("message").textContent = "Scrie un nume de minimum 2 caractere.";
        return;
      }
      userName = name;
      localStorage.setItem("somePlannerUserName", userName);
      showPlanner();
    }

    function showPlanner() {
      document.getElementById("nameScreen").classList.add("hidden");
      document.getElementById("appScreen").classList.remove("hidden");
      document.getElementById("userName").textContent = "👤 " + userName;
      loadPosts();
    }

    function changeName() {
      document.getElementById("appScreen").classList.add("hidden");
      document.getElementById("nameScreen").classList.remove("hidden");
      document.getElementById("personName").value = userName;
      document.getElementById("personName").focus();
    }

    async function loadPosts() {
      document.getElementById("loading").textContent = "Se sincronizează postările...";
      const {data, error} = await supabase.from("posts").select("*").order("scheduled_at", {ascending:true});
      if (error) {
        document.getElementById("loading").textContent = "Eroare: " + error.message;
        return;
      }
      posts = data || [];
      document.getElementById("loading").textContent = "";
      render();
    }

    function render() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      document.getElementById("calendarTitle").textContent = months[month] + " " + year;

      const calendar = document.getElementById("calendar");
      calendar.innerHTML = "";
      const start = new Date(year, month, 1).getDay();
      const days = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < start + days; i++) {
        const day = i - start + 1;
        const cell = document.createElement("div");

        if (day <= 0) {
          cell.className = "day empty";
          calendar.appendChild(cell);
          continue;
        }

        const date = year + "-" + String(month + 1).padStart(2,"0") + "-" + String(day).padStart(2,"0");
        cell.className = "day";
        cell.innerHTML = '<div class="date">' + day + "</div>";

        posts.filter(p => p.scheduled_at === date).forEach(p => {
          const item = document.createElement("button");
          item.className = "event";
          item.style.borderLeftColor = p.status === "published" ? "#49c95f" : p.status === "draft" ? "#5ca9ff" : "#bb8cff";
          item.textContent = p.platform + ": " + p.title;
          item.onclick = () => alert("Titlu: " + p.title + "\n\nPlatformă: " + p.platform + "\nStatus: " + p.status + "\nAdăugat de: " + (p.author_name || "—") + "\n\n" + (p.body || ""));
          cell.appendChild(item);
        });

        calendar.appendChild(cell);
      }

      const inYear = posts.filter(p => p.scheduled_at.startsWith(String(year)));
      const prefix = year + "-" + String(month + 1).padStart(2,"0");
      document.getElementById("published").textContent = inYear.filter(p => p.status === "published").length;
      document.getElementById("drafts").textContent = inYear.filter(p => p.status === "draft").length;
      document.getElementById("planned").textContent = inYear.filter(p => p.status === "planned").length;
      document.getElementById("thisMonth").textContent = posts.filter(p => p.scheduled_at.startsWith(prefix)).length;
      document.getElementById("total").textContent = inYear.length;
    }

    function moveMonth(direction) {
      currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth() + direction, 1);
      render();
    }

    function openModal() {
      document.getElementById("postDate").value = new Date().toISOString().slice(0,10);
      document.getElementById("postOwner").value = userName;
      document.getElementById("overlay").classList.add("show");
    }

    function closeModal() {
      document.getElementById("overlay").classList.remove("show");
    }

    async function savePost(event) {
      event.preventDefault();
      const post = {
        title: document.getElementById("postTitle").value.trim(),
        body: document.getElementById("postText").value.trim(),
        scheduled_at: document.getElementById("postDate").value,
        platform: document.getElementById("postPlatform").value,
        status: document.getElementById("postStatus").value,
        author_name: userName
      };

      const {error} = await supabase.from("posts").insert(post);
      if (error) {
        alert("Nu s-a salvat: " + error.message);
        return;
      }
      event.target.reset();
      closeModal();
      loadPosts();
    }

    if (userName) showPlanner();
  </script>
</body>
</html>
